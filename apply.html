<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AL MASTER | التقديم على وظيفة</title>
  <meta name="theme-color" content="#0a0f3d">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    window.__AM_GUEST = true;   // separate sign-in from the employees' (see core/fb.js)
    (function () {
      try {
        var l = localStorage.getItem('am_lang') || 'ar';
        document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        var t = localStorage.getItem('am_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body class="guest-page pub-page pub-apply">
  <header class="guest-top"><img src="assets/img/logo-white.png" alt="AL MASTER"><button class="pub-lang" id="pub-lang" type="button"></button></header>
  <main class="guest-wrap pub-wrap" id="g"><div class="card guest-card"><div class="card-body"><span class="spinner"></span></div></div></main>
  <script type="module" src="assets/js/apply.js"></script>
</body>
</html>
